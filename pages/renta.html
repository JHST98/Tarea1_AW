<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Renta de Películas - CinePlus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">CinePlus</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link active" href="renta.html">Rentar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container py-4">
    <h2 class="mb-4">Rentar Películas</h2>

    <form id="formRenta">
      <div class="mb-3">
        <label>Nombre del cliente</label>
        <input type="text" id="cliente" class="form-control" required>
      </div>
      <div class="mb-3">
        <label>Selecciona películas (Ctrl+clic para múltiples)</label>
        <select id="peliculas" class="form-select" multiple size="5" required></select>
      </div>
      <div class="mb-3">
        <label>Días de renta</label>
        <input type="number" id="dias" class="form-control" min="1" required>
      </div>
      <div class="mb-3">
        <label>Forma de pago</label>
        <select id="pago" class="form-select">
          <option>Tarjeta</option>
          <option>Efectivo</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary">Rentar</button>
    </form>

    <!-- MODAL -->
    <div class="modal fade" id="modalResumen" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Resumen de compra</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body" id="resumen"></div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <small>&copy; 2024 CinePlus. Todos los derechos reservados.</small>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/renta.js"></script>
</body>
</html>
