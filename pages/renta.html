<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Renta de Películas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

  <h2>Rentar Películas</h2>

  <form id="formRenta">

    <div class="mb-3">
      <label>Nombre del cliente</label>
      <input type="text" id="cliente" class="form-control" required>
    </div>

    <div class="mb-3">
      <label>Selecciona películas</label>
      <select id="peliculas" class="form-select" multiple required>
      </select>
    </div>

    <div class="mb-3">
      <label>Días de renta</label>
      <input type="number" id="dias" class="form-control" min="1" required>
    </div>

    <div class="mb-3">
      <label>Forma de pago</label>
      <select id="pago" class="form-select">
        <option>Tarjeta</option>
        <option>Efectivo</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Rentar</button>

  </form>

  <!-- MODAL -->
  <div class="modal fade" id="modalResumen" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Resumen de compra</h5>
        </div>
        <div class="modal-body" id="resumen"></div>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/renta.js"></script>

</body>
</html>
