<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Detalle de Película</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container py-5">

      <!-- TÍTULO Y TRAILER -->
      <div class="text-center mb-4">
        <h2 id="titulo" class="mb-3"></h2>

        <div class="alert alert-info">
          ¡Disfruta del tráiler oficial y conoce más sobre esta película!
        </div>

        <div class="ratio ratio-16x9 mb-4">
          <iframe id="trailer" src="" allowfullscreen></iframe>
        </div>
      </div>

      <!-- DETALLE -->
      <div class="card mb-4">
        <div class="row g-0">
          <div class="col-md-4">
            <img id="poster" class="img-fluid rounded-start" />
          </div>
          <div class="col-md-8">
            <div class="card-body">
              <h5>Sinopsis</h5>
              <p id="sinopsis"></p>
              <span id="genero" class="badge bg-secondary"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- FORMULARIO -->
      <div class="card p-4 mt-4">
        <h4>Reservar Película</h4>

        <div class="mb-3">
          <label>Nombre</label>
          <input type="text" id="nombre" class="form-control" />
        </div>
        
        <div class="mb-3">
          <label>Correo</label>
          <input type="email" id="correo" class="form-control" />
        </div>

        <button id="btnReservar" class="btn btn-primary">
          Reservar
        </button>

        <div id="mensaje" class="mt-3"></div>
      </div>

      <div class="text-center mt-4">
        <a href="../index.html" class="btn btn-secondary">
          Volver al inicio
        </a>
      </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>

    <script>
      $(function () {

        // 🔹 Obtener ID de la URL
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get("id");

        //  Cargar película
        $.ajax({
          url: "../data/peliculas.json",
          method: "GET",
          dataType: "json",

          success: function (peliculas) {
            const peli = peliculas.find((p) => p.id == id);

            if (peli) {
              $("#titulo").text(peli.titulo);
              $("#poster").attr("src", "../img/" + peli.imagen);
              $("#sinopsis").text(peli.sinopsis);
              $("#trailer").attr("src", peli.trailer);
              $("#genero").text(peli.genero);
            }
          }
        });

        //  VALIDACIÓN
        $("#btnReservar").click(function () {

  let nombre = $("#nombre").val();
  let correo = $("#correo").val();

  if (nombre === "" || correo === "") {
    $("#mensaje").html(`
      <div class="alert alert-danger">
        Todos los campos son obligatorios
      </div>
    `);
    return;
  }

  const reserva = {
    nombre: nombre,
    correo: correo,
    pelicula: $("#titulo").text()
  };

  let reservas = JSON.parse(localStorage.getItem("reservas")) || [];

  reservas.push(reserva);

  localStorage.setItem("reservas", JSON.stringify(reservas));

  $("#mensaje").html(`
    <div class="alert alert-success">
      Reserva realizada con éxito
    </div>
  `);

});

      });
    </script>

  </body>
</html>
