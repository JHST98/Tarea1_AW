<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Detalle de Película - CinePlus</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">CinePlus</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link" href="renta.html">Rentar</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="container py-5">
    <!-- TÍTULO Y TRAILER -->
    <div class="text-center mb-4">
      <h2 id="titulo" class="mb-3"></h2>
      <div class="alert alert-info">¡Disfruta del tráiler oficial y conoce más sobre esta película!</div>
      <div class="ratio ratio-16x9 mb-4">
        <iframe id="trailer" src="" allowfullscreen></iframe>
      </div>
    </div>

    <!-- DETALLE -->
    <div class="card mb-4">
      <div class="row g-0">
        <div class="col-md-4">
          <img id="poster" class="img-fluid rounded-start" />
        </div>
        <div class="col-md-8">
          <div class="card-body">
            <h5>Sinopsis</h5>
            <p id="sinopsis"></p>
            <h5 id="precio" class="mt-3"></h5>
            <span id="estado" class="badge"></span> 
            <span id="genero" class="badge bg-secondary"></span>
          </div>
        </div>
      </div>
    </div>

    <!-- RESEÑAS -->
    <h4>Reseñas</h4>
    <div id="reseñas"></div>

    <!-- FORMULARIO RESERVA -->
    <div class="card p-4 mt-4">
      <h4>Reservar Película</h4>
      <div class="mb-3">
        <label>Nombre</label>
        <input type="text" id="nombre" class="form-control" />
      </div>
      <div class="mb-3">
        <label>Correo</label>
        <input type="email" id="correo" class="form-control" />
      </div>
      <button id="btnReservar" class="btn btn-primary">Reservar</button>
      <div id="mensaje" class="mt-3"></div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <small>&copy; 2024 CinePlus. Todos los derechos reservados.</small>
  </footer>

  <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    
    $(function () {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get("id");

      $.getJSON("../data/peliculas.json", function (peliculas) {
        const peli = peliculas.find(p => p.id == id);
        if (peli) {
          const hoy = new Date();
          const estreno = new Date(peli.estreno);
          let precio, estado;
          if (hoy <= estreno) {
            precio = peli.precios.estreno;
            estado = "Estreno";
            $("#estado").addClass("bg-danger");
          } else {
            precio = peli.precios.normal;
            estado = "En cartelera";
            $("#estado").addClass("bg-success");
          }
          $("#titulo").text(peli.titulo);
          $("#poster").attr("src", "../img/" + peli.imagen);
          $("#sinopsis").text(peli.sinopsis);
          $("#precio").text("Precio: $" + precio);
          $("#estado").text(estado);
          $("#trailer").attr("src", peli.trailer);
          let genero = Array.isArray(peli.generos) ? peli.generos.join(", ") : peli.genero || "Sin género";
          $("#genero").text(genero);
        }
      });

      $.getJSON("../data/reseñas.json", function (reseñas) {
        let filtradas = reseñas.filter(r => r.peliculaId == parseInt(id));
        let html = "";
        filtradas.forEach(r => {
          let estrellas = "🌟".repeat(r.calificacion);
          html += `<div class="card mb-2 p-2"><strong>${r.usuario}</strong><p>${r.comentario}</p><div>${estrellas}</div></div>`;
        });
        $("#reseñas").html(html);
      });

      $("#btnReservar").click(function () {
        let nombre = $("#nombre").val();
        let correo = $("#correo").val();
        if (nombre === "" || correo === "") {
          $("#mensaje").html(`<div class="alert alert-danger">Todos los campos son obligatorios</div>`);
          return;
        }
        const reserva = { nombre, correo, pelicula: $("#titulo").text() };
        let reservas = JSON.parse(localStorage.getItem("reservas")) || [];
        reservas.push(reserva);
        localStorage.setItem("reservas", JSON.stringify(reservas));
        $("#mensaje").html(`<div class="alert alert-success">Reserva realizada con éxito</div>`);
      });
    });
  </script>
</body>
</html>
